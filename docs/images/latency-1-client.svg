<text x="198" y="93" text-anchor="end" class="lab">Sedis (Skarn)</text>
<rect x="210" y="80" width="227.5" height="18" rx="2" class="f-skarn"/>
<line x1="437.5" y1="89" x2="584.5" y2="89" class="s-skarn" stroke-width="2"/>
<line x1="584.5" y1="85" x2="584.5" y2="93" class="s-skarn" stroke-width="2"/>
<text x="593.5" y="93" class="val">65 / 107</text>
<text x="198" y="129" text-anchor="end" class="lab">Python asyncio</text>
<rect x="210" y="116" width="129.5" height="18" rx="2" class="f-asyncio"/>
<line x1="339.5" y1="125" x2="472.5" y2="125" class="s-asyncio" stroke-width="2"/>
<line x1="472.5" y1="121" x2="472.5" y2="129" class="s-asyncio" stroke-width="2"/>
<text x="481.5" y="129" class="val">37 / 75</text>
<text x="198" y="165" text-anchor="end" class="lab">Python threads (GIL)</text>
<rect x="210" y="152" width="126.0" height="18" rx="2" class="f-threads"/>
<line x1="336.0" y1="161" x2="451.5" y2="161" class="s-threads" stroke-width="2"/>
<line x1="451.5" y1="157" x2="451.5" y2="165" class="s-threads" stroke-width="2"/>
<text x="460.5" y="165" class="val">36 / 69</text>
<text x="198" y="201" text-anchor="end" class="lab">Python free-threaded</text>
<rect x="210" y="188" width="129.5" height="18" rx="2" class="f-ftthreads"/>
<line x1="339.5" y1="197" x2="402.5" y2="197" class="s-ftthreads" stroke-width="2"/>
<line x1="402.5" y1="193" x2="402.5" y2="201" class="s-ftthreads" stroke-width="2"/>
<text x="411.5" y="201" class="val">37 / 55</text>
<text x="198" y="237" text-anchor="end" class="lab">Memurai (C++)</text>
<rect x="210" y="224" width="101.5" height="18" rx="2" class="f-memurai"/>
<line x1="311.5" y1="233" x2="371.0" y2="233" class="s-memurai" stroke-width="2"/>
<line x1="371.0" y1="229" x2="371.0" y2="237" class="s-memurai" stroke-width="2"/>
<text x="380.0" y="237" class="val">29 / 46</text>
