<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 439" width="780" height="439" role="img" aria-label="Let it crash, and notice what was lost. a supervisor restarts a shard; batch numbers find the requests that died with it">
<title>Let it crash, and notice what was lost. a supervisor restarts a shard; batch numbers find the requests that died with it</title>
<style>
svg{--surface:#ffffff;--ink:#17202c;--muted:#586476;--faint:#8b95a5;--rule:#dbe0e7;--grid:#e7ebf0;--skarn:#0b7d74;--skarn1:#5fb3aa;--asyncio:#3572a5;--threads:#8a94a6;--ftthreads:#b3306b;--memurai:#7a4fa3;--gc:#c0392b}
@media (prefers-color-scheme: dark){svg{--surface:#161b22;--ink:#e6ebf1;--muted:#a2adbd;--faint:#74808f;--rule:#2b3440;--grid:#232b36;--skarn:#3cc2b4;--skarn1:#8adfd5;--asyncio:#6aa6dc;--threads:#9aa4b5;--ftthreads:#ec79a8;--memurai:#b38ae0;--gc:#f07c6c}}
.bg{fill:var(--surface);stroke:var(--rule)}
text{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace;font-size:12px;fill:var(--muted)}
.t{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:16px;font-weight:600;fill:var(--ink)}
.st{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;fill:var(--muted)}
.ax{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:var(--faint)}
.lab{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:var(--ink)}
.box{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:var(--ink)}
.small{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;fill:var(--muted)}
.val{fill:var(--ink);font-weight:600}
.g{stroke:var(--grid);stroke-width:1}
.b{stroke:var(--rule);stroke-width:1}
.frame{fill:none;stroke:var(--faint);stroke-width:1.2}
.arrow{stroke:var(--muted);stroke-width:1.4;fill:none;marker-end:url(#ah)}
.whisk{stroke:var(--ink);stroke-width:1;opacity:.55}
.pale{fill-opacity:.35}
.f-skarn{fill:var(--skarn)} .s-skarn{stroke:var(--skarn);fill:none}
.f-skarn1{fill:var(--skarn1)} .s-skarn1{stroke:var(--skarn1);fill:none}
.f-asyncio{fill:var(--asyncio)} .s-asyncio{stroke:var(--asyncio);fill:none}
.f-threads{fill:var(--threads)} .s-threads{stroke:var(--threads);fill:none}
.f-ftthreads{fill:var(--ftthreads)} .s-ftthreads{stroke:var(--ftthreads);fill:none}
.f-memurai{fill:var(--memurai)} .s-memurai{stroke:var(--memurai);fill:none}
.f-gc{fill:var(--gc)} .s-gc{stroke:var(--gc);fill:none}
</style>
<rect class="bg" x="0.5" y="0.5" width="779" height="438" rx="10"/>
<text class="t" x="24" y="34">Let it crash, and notice what was lost</text>
<text class="st" x="24" y="55">a supervisor restarts a shard; batch numbers find the requests that died with it</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<rect x="24" y="100" width="156" height="56" rx="8" class="f-memurai" fill-opacity=".14"/>
<rect x="24" y="100" width="156" height="56" rx="8" class="frame"/>
<text x="102" y="120" text-anchor="middle" class="box">supervisor</text>
<text x="102" y="138" text-anchor="middle" class="small">one_for_one</text>
<rect x="232" y="76" width="190" height="46" rx="8" class="f-skarn" fill-opacity=".14"/>
<rect x="232" y="76" width="190" height="46" rx="8" class="frame"/>
<text x="327" y="104" text-anchor="middle" class="box">slot 0  —  running</text>
<rect x="232" y="132" width="190" height="46" rx="8" class="f-gc" fill-opacity=".14"/>
<rect x="232" y="132" width="190" height="46" rx="8" class="frame"/>
<text x="327" y="160" text-anchor="middle" class="box">slot 1  —  restarting</text>
<rect x="232" y="188" width="190" height="46" rx="8" class="f-skarn" fill-opacity=".14"/>
<rect x="232" y="188" width="190" height="46" rx="8" class="frame"/>
<text x="327" y="216" text-anchor="middle" class="box">slot 2  —  running</text>
<rect x="470" y="108" width="286" height="90" rx="8" class="f-skarn1" fill-opacity=".14"/>
<rect x="470" y="108" width="286" height="90" rx="8" class="frame"/>
<text x="490" y="134" class="box">A slot outlives its actor.</text>
<text x="490" y="156" class="small">A restarted shard answers where</text>
<text x="490" y="173" class="small">its predecessor did; a send in</text>
<text x="490" y="190" class="small">between waits. There is no kill.</text>
<path d="M180,118 L232,99" class="arrow"/>
<path d="M180,128 L232,155" class="arrow"/>
<path d="M180,138 L232,211" class="arrow"/>
<text x="24" y="176" class="small">5 restarts in 10 s,</text>
<text x="24" y="193" class="small">then it gives up</text>
<rect x="24" y="262" width="140" height="44" rx="8" class="f-threads" fill-opacity=".14"/>
<rect x="24" y="262" width="140" height="44" rx="8" class="frame"/>
<text x="94" y="289" text-anchor="middle" class="box">connection</text>
<rect x="216" y="262" width="96" height="44" rx="8" class="f-skarn" fill-opacity=".14"/>
<rect x="216" y="262" width="96" height="44" rx="8" class="frame"/>
<text x="264" y="289" text-anchor="middle" class="box">batch 7</text>
<rect x="330" y="262" width="96" height="44" rx="8" class="f-skarn" fill-opacity=".14"/>
<rect x="330" y="262" width="96" height="44" rx="8" class="frame"/>
<text x="378" y="289" text-anchor="middle" class="box">batch 8</text>
<rect x="444" y="262" width="96" height="44" rx="8" class="f-skarn" fill-opacity=".14"/>
<rect x="444" y="262" width="96" height="44" rx="8" class="frame"/>
<text x="492" y="289" text-anchor="middle" class="box">batch 9</text>
<rect x="584" y="262" width="172" height="44" rx="8" class="f-skarn1" fill-opacity=".14"/>
<rect x="584" y="262" width="172" height="44" rx="8" class="frame"/>
<text x="670" y="289" text-anchor="middle" class="box">answer to 9</text>
<path d="M164,284 L216,284" class="arrow"/>
<path d="M312,284 L330,284" class="arrow"/>
<path d="M426,284 L444,284" class="arrow"/>
<path d="M540,284 L584,284" class="arrow"/>
<text x="24" y="334" class="small">Mail is FIFO per sender, so the answer to batch 9 PROVES that every earlier open batch to that shard was lost when it</text>
<text x="24" y="351" class="small">crashed — no monitor and no timeout is needed.</text>
<text x="24" y="368" class="small">A connection that has waited a second with nothing back sends an empty probe batch, so the proof arrives even when the</text>
<text x="24" y="385" class="small">client has gone quiet.</text>
<text x="24" y="402" class="small">A lost part is answered honestly: the command may or may not have run. Both halves are needed — removing either one</text>
<text x="24" y="419" class="small">makes the self-test hang.</text>
</svg>
