<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-label="What an append-only file costs. each contender with and without its log, back to back · 100 % = nothing lost">
<title>What an append-only file costs. each contender with and without its log, back to back · 100 % = nothing lost</title>
<style>
svg{--surface:#ffffff;--ink:#17202c;--muted:#586476;--faint:#8b95a5;--rule:#dbe0e7;--grid:#e7ebf0;--skarn:#0b7d74;--skarn1:#5fb3aa;--asyncio:#3572a5;--threads:#8a94a6;--ftthreads:#b3306b;--memurai:#7a4fa3;--gc:#c0392b}
@media (prefers-color-scheme: dark){svg{--surface:#161b22;--ink:#e6ebf1;--muted:#a2adbd;--faint:#74808f;--rule:#2b3440;--grid:#232b36;--skarn:#3cc2b4;--skarn1:#8adfd5;--asyncio:#6aa6dc;--threads:#9aa4b5;--ftthreads:#ec79a8;--memurai:#b38ae0;--gc:#f07c6c}}
.bg{fill:var(--surface);stroke:var(--rule)}
text{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace;font-size:12px;fill:var(--muted)}
.t{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:16px;font-weight:600;fill:var(--ink)}
.st{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;fill:var(--muted)}
.ax{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:var(--faint)}
.lab{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:var(--ink)}
.box{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:var(--ink)}
.small{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;fill:var(--muted)}
.val{fill:var(--ink);font-weight:600}
.g{stroke:var(--grid);stroke-width:1}
.b{stroke:var(--rule);stroke-width:1}
.frame{fill:none;stroke:var(--faint);stroke-width:1.2}
.arrow{stroke:var(--muted);stroke-width:1.4;fill:none;marker-end:url(#ah)}
.whisk{stroke:var(--ink);stroke-width:1;opacity:.55}
.pale{fill-opacity:.35}
.f-skarn{fill:var(--skarn)} .s-skarn{stroke:var(--skarn);fill:none}
.f-skarn1{fill:var(--skarn1)} .s-skarn1{stroke:var(--skarn1);fill:none}
.f-asyncio{fill:var(--asyncio)} .s-asyncio{stroke:var(--asyncio);fill:none}
.f-threads{fill:var(--threads)} .s-threads{stroke:var(--threads);fill:none}
.f-ftthreads{fill:var(--ftthreads)} .s-ftthreads{stroke:var(--ftthreads);fill:none}
.f-memurai{fill:var(--memurai)} .s-memurai{stroke:var(--memurai);fill:none}
.f-gc{fill:var(--gc)} .s-gc{stroke:var(--gc);fill:none}
</style>
<rect class="bg" x="0.5" y="0.5" width="779" height="419" rx="10"/>
<text class="t" x="24" y="34">What an append-only file costs</text>
<text class="st" x="24" y="55">each contender with and without its log, back to back · 100 % = nothing lost</text>
<line x1="230.0" y1="70" x2="230.0" y2="368" class="b"/>
<text x="230.0" y="384" text-anchor="middle">0 %</text>
<line x1="312.0" y1="70" x2="312.0" y2="368" class="g"/>
<text x="312.0" y="384" text-anchor="middle">20 %</text>
<line x1="394.0" y1="70" x2="394.0" y2="368" class="g"/>
<text x="394.0" y="384" text-anchor="middle">40 %</text>
<line x1="476.0" y1="70" x2="476.0" y2="368" class="g"/>
<text x="476.0" y="384" text-anchor="middle">60 %</text>
<line x1="558.0" y1="70" x2="558.0" y2="368" class="g"/>
<text x="558.0" y="384" text-anchor="middle">80 %</text>
<line x1="640.0" y1="70" x2="640.0" y2="368" class="g"/>
<text x="640.0" y="384" text-anchor="middle">100 %</text>
<text x="435.0" y="404" text-anchor="middle" class="ax">share of the throughput kept with the log (16 clients, fsync once a second)</text>
<text x="218" y="110" text-anchor="end" class="lab">Sedis (Skarn)</text>
<rect x="230" y="76" width="360.8" height="12" rx="1.5" class="f-skarn"/>
<text x="596.8" y="86" class="small">88 %  SET</text>
<rect x="230" y="91" width="299.6" height="12" rx="1.5" class="f-skarn" fill-opacity=".55"/>
<text x="535.6" y="101" class="small">73 %  SET, pipelined</text>
<rect x="230" y="106" width="340.0" height="12" rx="1.5" class="f-skarn"/>
<text x="576.0" y="116" class="small">83 %  INCR</text>
<rect x="230" y="121" width="308.7" height="12" rx="1.5" class="f-skarn" fill-opacity=".55"/>
<text x="544.7" y="131" class="small">75 %  INCR, pipelined</text>
<text x="218" y="186" text-anchor="end" class="lab">Memurai (C++)</text>
<rect x="230" y="152" width="357.2" height="12" rx="1.5" class="f-memurai"/>
<text x="593.2" y="162" class="small">87 %  SET</text>
<rect x="230" y="167" width="307.8" height="12" rx="1.5" class="f-memurai" fill-opacity=".55"/>
<text x="543.8" y="177" class="small">75 %  SET, pipelined</text>
<rect x="230" y="182" width="353.0" height="12" rx="1.5" class="f-memurai"/>
<text x="589.0" y="192" class="small">86 %  INCR</text>
<rect x="230" y="197" width="294.1" height="12" rx="1.5" class="f-memurai" fill-opacity=".55"/>
<text x="530.1" y="207" class="small">72 %  INCR, pipelined</text>
<text x="218" y="262" text-anchor="end" class="lab">Python asyncio</text>
<rect x="230" y="228" width="289.9" height="12" rx="1.5" class="f-asyncio"/>
<text x="525.9" y="238" class="small">71 %  SET</text>
<rect x="230" y="243" width="285.4" height="12" rx="1.5" class="f-asyncio" fill-opacity=".55"/>
<text x="521.4" y="253" class="small">70 %  SET, pipelined</text>
<rect x="230" y="258" width="293.0" height="12" rx="1.5" class="f-asyncio"/>
<text x="529.0" y="268" class="small">71 %  INCR</text>
<rect x="230" y="273" width="277.7" height="12" rx="1.5" class="f-asyncio" fill-opacity=".55"/>
<text x="513.7" y="283" class="small">68 %  INCR, pipelined</text>
<text x="218" y="338" text-anchor="end" class="lab">Python free-threaded</text>
<rect x="230" y="304" width="138.3" height="12" rx="1.5" class="f-ftthreads"/>
<text x="374.3" y="314" class="small">34 %  SET</text>
<rect x="230" y="319" width="161.3" height="12" rx="1.5" class="f-ftthreads" fill-opacity=".55"/>
<text x="397.3" y="329" class="small">39 %  SET, pipelined</text>
<rect x="230" y="334" width="141.5" height="12" rx="1.5" class="f-ftthreads"/>
<text x="377.5" y="344" class="small">35 %  INCR</text>
<rect x="230" y="349" width="162.2" height="12" rx="1.5" class="f-ftthreads" fill-opacity=".55"/>
<text x="398.2" y="359" class="small">40 %  INCR, pipelined</text>
</svg>
